{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - لوحة تحكم نقابة المهندسين المصرية</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="{% static 'certificates/style.css' %}">
  
  <style>
    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                  0 0 50px rgba(16, 185, 129, 0.03);
      z-index: 1;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="login-container">
    
    <header class="header" style="margin-bottom: 2rem;">
      <div class="logo-wrapper" style="width: 70px; height: 70px; margin-bottom: 0.75rem;">
        <svg class="logo-svg" style="width: 38px; height: 38px;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>
      <h1 class="title" style="font-size: 1.5rem;">بوابة الإشراف والتحكم</h1>
      <p class="subtitle" style="font-size: 0.85rem;">يرجى تسجيل الدخول للوصول للوحة المراقبة</p>
    </header>

    {% if error %}
    <div class="info-banner" style="background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.2); color: var(--danger); margin-bottom: 1.5rem; justify-content: center; font-weight: 700;">
      {{ error }}
    </div>
    {% endif; %}

    <form method="POST" action="">
      {% csrf_token %}
      
      <div class="form-grid" style="grid-template-columns: 1fr; gap: 1.25rem; margin-bottom: 1.5rem;">
        
        <div class="form-group" style="text-align: right;">
          <label for="username">اسم المستخدم:</label>
          <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username" style="padding: 0.75rem 1rem;">
        </div>

        <div class="form-group" style="text-align: right;">
          <label for="password">كلمة المرور:</label>
          <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password" style="width: 100%; background: rgba(10, 20, 15, 0.5); border: 1px solid var(--panel-border); border-radius: 12px; padding: 0.75rem 1rem; color: var(--text-primary); outline: none; font-size: 0.95rem; transition: var(--transition-smooth); text-align: right;" onfocus="this.style.borderColor='var(--accent)';" onblur="this.style.borderColor='var(--panel-border)';">
        </div>

      </div>

      <button type="submit" class="submit-btn" style="padding: 0.9rem; font-size: 1rem; margin-top: 0.5rem;">تسجيل الدخول</button>
    </form>

    <div class="footer-note" style="margin-top: 1.5rem;">
      <a href="{% url 'apply_view' %}" class="nav-link" style="font-size: 0.8rem;">العودة إلى صفحة حجز المهندسين</a>
    </div>

  </main>

</body>
</html>
